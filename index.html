<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giá cà phê</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #34495e;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .spell-text {
            font-style: italic;
            color: #e67e22;
            font-size: 13px;
            margin-top: 4px;
        }
        .combo-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .combo-box label {
            font-size: 12px;
            font-weight: normal;
            color: #666;
            margin-bottom: 2px;
        }
        .result-box {
            margin-top: 20px;
            background: #eef2f3;
            padding: 12px;
            border-radius: 5px;
        }
        .custom-result {
            font-size: 15px;
            color: #d35400;
            font-weight: bold;
            text-align: center;
        }
        .spell-money {
            font-size: 13px;
            color: #27ae60;
            text-align: center;
            margin-top: 5px;
            font-style: italic;
        }
        .dynamic-table {
            margin-top: 15px;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
            color: #2c3e50;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        td:last-child, th:last-child {
            text-align: right;
            color: #27ae60;
            font-weight: bold;
        }
        .sub-spell {
            font-size: 11px;
            color: #7f8c8d;
            font-weight: normal;
            display: block;
        }
        .custom-check-box {
            margin-top: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            background: #fff;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            flex-wrap: wrap;
        }
        .custom-check-box span.title {
            font-size: 14px;
            font-weight: bold;
            color: #34495e;
            width: 100%;
        }
        .custom-check-box input {
            flex: 2;
            min-width: 100px;
        }
        .custom-check-box select {
            flex: 1.5;
            min-width: 90px;
        }
        .custom-check-result {
            width: 100%;
            text-align: right;
            margin-top: 5px;
        }

        /* Tối ưu cho màn hình điện thoại nhỏ */
        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }
            h2 {
                font-size: 18px;
            }
            input, select {
                font-size: 14px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tính Giá Cà Phê</h2>
    
    <!-- Nhập giá tiền mỗi kg -->
    <div class="form-group">
        <label for="pricePerKg">Giá tiền mỗi 1 kg (VNĐ):</label>
        <input type="text" id="pricePerKg" placeholder="Ví dụ: 95.300" oninput="handlePriceInput(this)">
        <div class="spell-text" id="priceInWords">Bằng chữ: Không đồng</div>
    </div>

    <!-- Nhập tổ hợp Tấn + Tạ + Kg -->
    <div class="form-group">
        <label>Nhập số lượng tùy chọn (Tấn, Tạ, Kg):</label>
        <div class="combo-group">
            <div class="combo-box">
                <label>Tấn</label>
                <input type="number" id="inputTon" value="0" min="0" oninput="calculate()">
            </div>
            <div class="combo-box">
                <label>Tạ</label>
                <input type="number" id="inputTa" value="0" min="0" oninput="calculate()">
            </div>
            <div class="combo-box">
                <label>Kg</label>
                <input type="number" id="inputKg" value="1" min="0" oninput="calculate()">
            </div>
        </div>
    </div>

    <div class="result-box">
        <div class="custom-result" id="customResultText">
            Thành tiền: 0 đ
        </div>
        <div class="spell-money" id="customResultWords">
            Bằng chữ: Không đồng
        </div>
    </div>

    <!-- Bảng tra cứu tự động từ 1 tạ đến 10 tấn -->
    <div class="dynamic-table">
        <table id="priceTable">
            <thead>
                <tr>
                    <th>Số lượng</th>
                    <th>Quy ra Kg</th>
                    <th>Thành tiền</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- Ô mốc tùy ý có chọn đơn vị Kg, Tạ, Tấn -->
    <div class="custom-check-box">
        <span class="title">Thêm mốc tùy ý:</span>
        <input type="number" id="customCheckVal" placeholder="Nhập số lượng..." value="" oninput="calculate()">
        <select id="customCheckUnit" onchange="calculate()">
            <option value="kg">Kg</option>
            <option value="ta">Tạ</option>
            <option value="tan">Tấn</option>
        </select>
        <div class="custom-check-result">
            <span id="customCheckMoney" style="font-weight: bold; color: #27ae60; font-size: 15px;">0 đ</span>
            <div id="customCheckWords" style="font-size: 12px; color: #e67e22; font-style: italic;">Bằng chữ: Không đồng</div>
        </div>
    </div>
</div>

<script>
    function formatCurrency(amount) {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
    }

    function formatNumberInput(value) {
        let cleanVal = value.replace(/\D/g, '');
        if (!cleanVal) return '';
        return parseInt(cleanVal, 10).toLocaleString('vi-VN');
    }

    // Hàm đọc số thành chữ tiếng Việt chuẩn
    function docSo(so) {
        if (isNaN(so) || so <= 0) return "Không đồng";
        const chuSo = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
        function docBlock(num) {
            let tr = Math.floor(num / 100);
            let ch = Math.floor((num % 100) / 10);
            let dv = num % 10;
            let s = "";
            if (tr > 0 || num >= 100) {
                s += chuSo[tr] + " trăm ";
                if (ch === 0 && dv > 0) s += "lẻ ";
            }
            if (ch > 1) {
                s += chuSo[ch] + " mươi ";
                if (dv === 1) s += "mốt ";
                else if (dv === 5) s += "lăm ";
                else if (dv > 0) s += chuSo[dv] + " ";
            } else if (ch === 1) {
                s += "mười ";
                if (dv === 5) s += "lăm ";
                else if (dv > 0) s += chuSo[dv] + " ";
            } else if (ch === 0 && dv > 0 && tr > 0) {
                s += chuSo[dv] + " ";
            } else if (ch === 0 && dv > 0 && tr === 0) {
                s += chuSo[dv] + " ";
            }
            return s.trim();
        }

        let billion = Math.floor(so / 1000000000);
        let million = Math.floor((so % 1000000000) / 1000000);
        let thousand = Math.floor((so % 1000000) / 1000);
        let remainder = so % 1000;
        let result = "";

        if (billion > 0) {
            result += docBlock(billion) + " tỷ ";
            if (million === 0 && thousand === 0 && remainder > 0) result += "không triệu không nghìn ";
        }
        if (million > 0) {
            result += docBlock(million) + " triệu ";
            if (thousand === 0 && remainder > 0) result += "không nghìn ";
        }
        if (thousand > 0) {
            result += docBlock(thousand) + " nghìn ";
        }
        if (remainder > 0) {
            result += docBlock(remainder);
        }
        let finalStr = result.trim() + " đồng";
        return finalStr.charAt(0).toUpperCase() + finalStr.slice(1);
    }

    function handlePriceInput(input) {
        input.value = formatNumberInput(input.value);
        let rawVal = parseInt(input.value.replace(/\./g, ''), 10) || 0;
        document.getElementById('priceInWords').innerText = "Bằng chữ: " + docSo(rawVal);
        calculate();
    }

    function getPricePerKg() {
        let val = document.getElementById('pricePerKg').value.replace(/\./g, '');
        return parseFloat(val) || 0;
    }

    function calculate() {
        let pricePerKg = getPricePerKg();

        // 1. Tính ô tổ hợp Tấn + Tạ + Kg
        let ton = parseFloat(document.getElementById('inputTon').value) || 0;
        let ta = parseFloat(document.getElementById('inputTa').value) || 0;
        let kg = parseFloat(document.getElementById('inputKg').value) || 0;

        let totalKg = (ton * 1000) + (ta * 100) + kg;
        let totalMoney = pricePerKg * totalKg;

        let descText = [];
        if (ton > 0) descText.push(`${ton} tấn`);
        if (ta > 0) descText.push(`${ta} tạ`);
        if (kg > 0 || descText.length === 0) descText.push(`${kg} kg`);

        document.getElementById('customResultText').innerText = 
            `Thành tiền cho (${descText.join(' + ')}) = ${totalKg.toLocaleString('vi-VN')} kg: ${formatCurrency(totalMoney)}`;
        document.getElementById('customResultWords').innerText = "Bằng chữ: " + docSo(totalMoney);

        // 2. Tạo bảng động từ 1 tạ đến 10 tấn
        let tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        let milestones = [
            { label: '1 Tạ', kg: 100 }, { label: '2 Tạ', kg: 200 }, { label: '3 Tạ', kg: 300 },
            { label: '4 Tạ', kg: 400 }, { label: '5 Tạ', kg: 500 }, { label: '6 Tạ', kg: 600 },
            { label: '7 Tạ', kg: 700 }, { label: '8 Tạ', kg: 800 }, { label: '9 Tạ', kg: 900 },
            { label: '1 Tấn', kg: 1000 }, { label: '2 Tấn', kg: 2000 }, { label: '3 Tấn', kg: 3000 },
            { label: '4 Tấn', kg: 4000 }, { label: '5 Tấn', kg: 5000 }, { label: '6 Tấn', kg: 6000 },
            { label: '7 Tấn', kg: 7000 }, { label: '8 Tấn', kg: 8000 }, { label: '9 Tấn', kg: 9000 },
            { label: '10 Tấn', kg: 10000 }
        ];

        milestones.forEach(m => {
            let money = pricePerKg * m.kg;
            let row = document.createElement('tr');
            row.innerHTML = `
                <td>${m.label}</td>
                <td>${m.kg.toLocaleString('vi-VN')} kg</td>
                <td>
                    ${formatCurrency(money)}
                    <span class="sub-spell">${docSo(money)}</span>
                </td>
            `;
            tableBody.appendChild(row);
        });

        // 3. Xử lý mốc tùy ý có chọn đơn vị
        let customVal = parseFloat(document.getElementById('customCheckVal').value) || 0;
        let customUnit = document.getElementById('customCheckUnit').value;
        let customKg = customVal;
        if (customUnit === 'ta') customKg = customVal * 100;
        if (customUnit === 'tan') customKg = customVal * 1000;

        let customMoney = pricePerKg * customKg;
        document.getElementById('customCheckMoney').innerText = formatCurrency(customMoney);
        document.getElementById('customCheckWords').innerText = "Bằng chữ: " + docSo(customMoney);
    }

    // Chạy mặc định khi tải trang
    window.onload = function() {
        document.getElementById('pricePerKg').value = "";
        handlePriceInput(document.getElementById('pricePerKg'));
    };
</script>

</body>
</html>
